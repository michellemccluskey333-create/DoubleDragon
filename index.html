
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Double Dragon Tattoo</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">

<meta property="og:title" content="Double Dragon Tattoo">
<meta property="og:description" content="Custom and flash tattooing in Omaha.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<style>
/* ========================================
   DOUBLE DRAGON TATTOO
   BRAND COLORS AND GLOBAL STYLES
======================================== */
:root {
  --bg: #000000;
  --cream: #f2d96b;
  --muted: #d1b85b;
  --red: #bd3028;
  --red-soft: rgba(189,48,40,.16);
  --red-border: rgba(238,204,80,.72);
  --red-glow: rgba(189,48,40,.35);
  --line: rgba(238,204,80,.22);
  --ease: cubic-bezier(.22,.61,.36,1);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--cream);
  font-family: "Raleway", Arial, sans-serif;
  overflow-x: hidden;
}
body.intro-running { overflow: hidden; }
img { display: block; max-width: 100%; }
a { color: inherit; }

/* ========================================
   BLACKOUT INTRO
======================================== */
.blackout {
  position: fixed;
  inset: 0;
  z-index: 900;
  background: #000;
  opacity: 1;
  pointer-events: none;
  transition: opacity .9s ease;
}
body.hero-live .blackout { opacity: 0; }

/* ========================================
   ANIMATED DOUBLE DRAGON LOGO
======================================== */
.site-logo {
  position: fixed;
  z-index: 1000;
  top: 50%;
  left: 50%;
  width: min(76vw,800px);
  transform: translate(-50%,-50%);
  transform-origin: center center;
  filter:
    drop-shadow(0 0 12px rgba(189,48,40,.26))
    drop-shadow(0 0 32px rgba(189,48,40,.14));
  transition:
    top 1.05s var(--ease),
    width 1.05s var(--ease),
    transform 1.05s var(--ease),
    opacity .25s ease;
}
body.logo-settling .site-logo {
  top: 15px;
  width: min(32vw,380px);
  transform: translate(-50%,0);
}
body.scrolled .site-logo {
  top: 8px;
  width: min(20vw,180px);
  transform: translate(-50%,0);
}

/* ========================================
   FIXED HEADER
======================================== */
.fixed-top-bar {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 950;
  width: 100%;
  height: 92px;
  background: rgba(0,0,0,.92);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(8px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease;
}
body.scrolled .fixed-top-bar { opacity: 1; }

/* ========================================
   HAMBURGER MENU
======================================== */
.menu-toggle {
  position: fixed;
  top: 28px;
  left: 32px;
  z-index: 1100;
  width: 44px;
  height: 36px;
  border: 1px solid var(--red-border);
  background: rgba(0,0,0,.18);
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity .7s ease, border-color .2s,
    background .2s, box-shadow .2s;
}
body.nav-live .menu-toggle {
  opacity: 1;
  pointer-events: auto;
}
.menu-toggle:hover {
  border-color: var(--red);
  background: var(--red-soft);
  box-shadow: 0 0 12px var(--red-glow);
}
.menu-toggle span {
  display: block;
  width: 24px;
  height: 1px;
  margin: 6px auto;
  background: var(--cream);
  transition: transform .25s ease, opacity .25s ease;
}
body.menu-open .menu-toggle span:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}
body.menu-open .menu-toggle span:nth-child(2) {
  opacity: 0;
}
body.menu-open .menu-toggle span:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}

/* ========================================
   BOOK NOW BUTTON
======================================== */
.book-top {
  position: fixed;
  top: 28px;
  right: 32px;
  z-index: 1100;
  padding: 13px 22px;
  border: 1px solid var(--red-border);
  color: var(--cream);
  background: rgba(0,0,0,.24);
  font-family: Arial,sans-serif;
  font-size: .72rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  text-decoration: none;
  opacity: 0;
  pointer-events: none;
  box-shadow: 0 0 14px rgba(189,48,40,.1);
  transition: opacity .7s ease, background .2s,
    color .2s, border-color .2s, box-shadow .2s;
}
body.nav-live .book-top {
  opacity: 1;
  pointer-events: auto;
}
.book-top:hover {
  background: var(--red-soft);
  color: #fff3bd;
  border-color: var(--red);
  box-shadow: 0 0 24px var(--red-glow);
}

/* ========================================
   SLIDE-OUT NAVIGATION
======================================== */
.pull-menu {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 1050;
  width: min(285px,84vw);
  height: 100vh;
  padding: 108px 30px 34px;
  background: linear-gradient(
    to bottom,rgba(0,0,0,.98),rgba(8,8,8,.96)
  );
  border-right: 1px solid var(--line);
  transform: translateX(-100%);
  transition: transform .45s var(--ease);
  overflow: hidden;
}
body.menu-open .pull-menu {
  transform: translateX(0);
}
.menu-content {
  position: relative;
  z-index: 2;
  min-height: 100%;
  display: flex;
  flex-direction: column;
}
.pull-menu-links {
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.pull-menu a {
  position: relative;
  width: fit-content;
  color: var(--cream);
  font-family: Arial,sans-serif;
  font-size: .82rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  text-decoration: none;
  padding-bottom: 8px;
}
.pull-menu a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  width: 0;
  height: 1px;
  background: var(--red);
  box-shadow: 0 0 8px var(--red-glow);
  transition: width .22s ease;
}
.pull-menu a:hover::after { width: 100%; }
.pull-menu a:hover {
  color: #fff3bd;
  text-shadow: 0 0 10px var(--red-glow);
}
.pull-menu .menu-book-btn {
  margin-top: 18px;
  width: 100%;
  max-width: 190px;
  padding: 12px 16px;
  border: 1px solid var(--red-border);
  color: var(--cream);
  text-align: center;
  background: rgba(189,48,40,.055);
}
.pull-menu .menu-book-btn::after { display: none; }
.pull-menu .menu-book-btn:hover {
  background: var(--red-soft);
  border-color: var(--red);
  box-shadow: 0 0 24px var(--red-glow);
}
.no-piercer-note {
  margin: 34px 0 0;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-family: Arial,sans-serif;
  font-size: .76rem;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.menu-logo-small {
  position: absolute;
  left: 50%;
  bottom: 24px;
  width: 180px;
  transform: translateX(-50%);
  opacity: .65;
  filter: drop-shadow(0 0 12px var(--red-glow));
  pointer-events: none;
}
.menu-backdrop {
  position: fixed;
  inset: 0;
  z-index: 1040;
  background: rgba(0,0,0,.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s ease;
}
body.menu-open .menu-backdrop {
  opacity: 1;
  pointer-events: auto;
}

/* ========================================
   HERO IMAGE AND INTRO
======================================== */
.hero {
  position: relative;
  min-height: 100vh;
  background: #000;
  overflow: hidden;
}
.hero-media {
  position: absolute;
  inset: 0;
  opacity: 0;
  transform: scale(1.025);
  filter: brightness(.12) contrast(1.08) saturate(.45);
  transition:
    opacity 1.1s ease,
    transform 1.4s var(--ease),
    filter 1.4s ease;
}
body.hero-live .hero-media {
  opacity: 1;
  transform: scale(1);
}
body.hero-bright .hero-media {
  filter: brightness(.72) contrast(1.06) saturate(.72);
}
.hero-media::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  background:
    linear-gradient(to bottom,
      rgba(0,0,0,.82) 0%,
      rgba(0,0,0,.22) 34%,
      rgba(0,0,0,.18) 64%,
      rgba(0,0,0,.86) 100%),
    linear-gradient(to right,
      rgba(0,0,0,.68) 0%,
      rgba(0,0,0,.36) 32%,
      rgba(0,0,0,.14) 72%,
      rgba(0,0,0,.42) 100%);
  pointer-events: none;
}
.hero-img {
  position: absolute;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

/* ========================================
   HERO TEXT - VINTAGE SIGN IMAGE
======================================== */
.hero-text {
  position: absolute;
  z-index: 20;
  left: 50%;
  right: auto;
  bottom: 16%;
  width: min(45vw,600px);
  max-width: none;
  text-align: center;
  opacity: 0;
  transform: translate(-50%,14px);
  transition: opacity .8s ease, transform .8s ease;
}
body.nav-live .hero-text {
  opacity: 1;
  transform: translate(-50%,0);
}
.hero-sign-image {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
  filter: drop-shadow(0 8px 16px rgba(0,0,0,.7));
}
